<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background subtle rounded shield -->
  <rect width="64" height="64" rx="14" fill="#0B0F19"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Isometric 3D Cadastral Parcel Volume -->
  <!-- Bottom Surface Parcel Layer (Emerald) -->
  <path d="M32 46L14 36L32 26L50 36L32 46Z" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Middle Stratified Floor Layer (Cyan) -->
  <path d="M32 38L16 29L32 20L48 29L32 38Z" fill="#06B6D4" fill-opacity="0.4" stroke="#06B6D4" stroke-width="1.75" stroke-linejoin="round"/>
  
  <!-- Top Roof Layer (Sky Blue) -->
  <path d="M32 30L18 22L32 14L46 22L32 30Z" fill="#38BDF8" fill-opacity="0.75" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Vertical Cadastral Boundary Pillars -->
  <line x1="32" y1="14" x2="32" y2="46" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="18" y1="22" x2="14" y2="36" stroke="#10B981" stroke-width="1.2"/>
  <line x1="46" y1="22" x2="50" y2="36" stroke="#10B981" stroke-width="1.2"/>

  <!-- Coordinate Vertex Points -->
  <circle cx="32" cy="14" r="2" fill="#38BDF8"/>
  <circle cx="18" cy="22" r="1.75" fill="#38BDF8"/>
  <circle cx="46" cy="22" r="1.75" fill="#38BDF8"/>
  <circle cx="32" cy="30" r="1.75" fill="#06B6D4"/>
  <circle cx="32" cy="46" r="2" fill="#10B981"/>
</svg>
